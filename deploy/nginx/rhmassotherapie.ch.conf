server {
    listen 80;
    listen [::]:80;

    server_name www.rhmassotherapie.ch;

    return 301 http://rhmassotherapie.ch$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name rhmassotherapie.ch;

    root /var/www/rhmassotherapie.ch/html;
    index parking.html index.html;

    access_log /var/log/nginx/rhmassotherapie.ch.access.log;
    error_log /var/log/nginx/rhmassotherapie.ch.error.log;

    location / {
        try_files $uri $uri/ /parking.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
